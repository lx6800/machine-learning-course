<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>机器学习·从零到推导</title><link rel="stylesheet" href="../assets/style.css"><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><script defer src="../assets/content.js"></script><script defer src="../assets/deep.js"></script><script defer src="../assets/app.js"></script></head><body data-page="code" data-chapter="02_logistic_regression" data-prefix="../"><div id="app"></div><script>window.CODE_TEXT="import numpy as np  # 导入 NumPy\nfrom sklearn.linear_model import LogisticRegression  # 导入库实现\nX = np.array([[-2.0], [-1.0], [1.0], [2.0]])  # 准备一维分类特征\ny = np.array([0.0, 0.0, 1.0, 1.0])  # 准备二元标签\ndef sigmoid(z):  # 定义 sigmoid 函数\n    z = np.clip(z, -40, 40)  # 限制指数输入以避免溢出\n    return 1 / (1 + np.exp(-z))  # 返回正类概率\nw = np.zeros(X.shape[1])  # 初始化权重\nb = 0.0  # 初始化截距\nrate = 0.1  # 设定学习率\nfor step in range(1000):  # 反复进行梯度下降\n    p = sigmoid(X @ w + b)  # 计算每条样本的正类概率\n    w -= rate * (X.T @ (p - y) / len(y))  # 更新权重\n    b -= rate * np.mean(p - y)  # 更新截距\np = sigmoid(X @ w + b)  # 计算训练后的概率\nloss = -np.mean(y * np.log(p) + (1 - y) * np.log(1 - p))  # 计算交叉熵\nmodel = LogisticRegression(C=1000).fit(X, y)  # 训练弱正则化的 sklearn 模型\nprint('手写概率', p, '交叉熵', loss)  # 显示手写结果\nprint('sklearn 概率', model.predict_proba(X)[:, 1])  # 显示库结果\n";</script></body></html>
