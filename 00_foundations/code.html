<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>机器学习·从零到推导</title><link rel="stylesheet" href="../assets/style.css"><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><script defer src="../assets/content.js"></script><script defer src="../assets/deep.js"></script><script defer src="../assets/app.js"></script></head><body data-page="code" data-chapter="00_foundations" data-prefix="../"><div id="app"></div><script>window.CODE_TEXT="import numpy as np  # 导入数值计算库\nX = np.array([[1.0], [2.0], [3.0]])  # 准备三条单特征样本\ny = np.array([3.0, 5.0, 7.0])  # 准备对应标签\nw = np.array([0.0])  # 初始化可学习权重\nb = 0.0  # 初始化截距\nrate = 0.1  # 设定学习率\nfor step in range(30):  # 重复执行梯度下降\n    pred = X @ w + b  # 计算当前预测\n    error = pred - y  # 计算预测减真实的误差\n    grad_w = 2 * X.T @ error / len(y)  # 计算平均平方损失对权重的梯度\n    grad_b = 2 * error.mean()  # 计算平均平方损失对截距的梯度\n    w -= rate * grad_w  # 沿负梯度更新权重\n    b -= rate * grad_b  # 沿负梯度更新截距\nprint(w, b)  # 显示训练结果\n";</script></body></html>
