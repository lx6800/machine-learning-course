<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>机器学习·从零到推导</title><link rel="stylesheet" href="../assets/style.css"><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><script defer src="../assets/content.js"></script><script defer src="../assets/deep.js"></script><script defer src="../assets/app.js"></script></head><body data-page="code" data-chapter="05_kernel" data-prefix="../"><div id="app"></div><script>window.CODE_TEXT="import numpy as np  # 导入 NumPy\nfrom sklearn.svm import SVC  # 导入核 SVM\nX = np.array([[-2.0], [-1.0], [1.0], [2.0]])  # 准备一维样本\ny = np.array([1, -1, -1, 1])  # 设定两端同类、中间同类的非线性标签\ndef poly_kernel(A, B):  # 手写二次多项式核\n    return (1 + A @ B.T) ** 2  # 直接计算隐式特征空间内积\ndef rbf_kernel(A, B, length=1.0):  # 手写 RBF 核\n    sq = np.sum((A[:, None, :] - B[None, :, :]) ** 2, axis=2)  # 计算两两平方距离\n    return np.exp(-sq / (2 * length ** 2))  # 把距离转成相似度\nK = poly_kernel(X, X)  # 计算训练 Gram 矩阵\neigenvalues = np.linalg.eigvalsh(K)  # 检查矩阵特征值\nmodel = SVC(kernel='poly', degree=2, gamma=1, coef0=1, C=10).fit(X, y)  # 训练二次核 SVM\nprint('Gram 矩阵', K)  # 显示手写核矩阵\nprint('最小特征值', eigenvalues.min())  # 显示半正定检查结果\nprint('RBF 相似度', rbf_kernel(X, X))  # 显示距离型核\nprint('sklearn 分类', model.predict(X))  # 显示训练点分类结果\n";</script></body></html>
