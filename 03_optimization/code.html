<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>机器学习·从零到推导</title><link rel="stylesheet" href="../assets/style.css"><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><script defer src="../assets/content.js"></script><script defer src="../assets/deep.js"></script><script defer src="../assets/app.js"></script></head><body data-page="code" data-chapter="03_optimization" data-prefix="../"><div id="app"></div><script>window.CODE_TEXT="import numpy as np  # 导入 NumPy\nfrom scipy.optimize import minimize  # 导入通用约束优化器\nx = 0.0  # 初始化一个标量参数\nrate = 0.1  # 设定梯度步长\nfor step in range(100):  # 迭代投影梯度法\n    gradient = 2 * (x - 3)  # 计算目标 (x-3)^2 的导数\n    x = x - rate * gradient  # 先走无约束下降步\n    x = min(x, 1.0)  # 再投影回可行域 x<=1\nresult = minimize(lambda z: (z[0] - 3) ** 2, [0.0], constraints={'type': 'ineq', 'fun': lambda z: 1 - z[0]})  # 用 scipy 求同一约束问题\nprint('手写投影法', x)  # 输出手写解\nprint('scipy 对照', result.x[0])  # 输出库实现解\n";</script></body></html>
