<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>机器学习·从零到推导</title><link rel="stylesheet" href="../assets/style.css"><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><script defer src="../assets/content.js"></script><script defer src="../assets/deep.js"></script><script defer src="../assets/app.js"></script></head><body data-page="code" data-chapter="06_representer" data-prefix="../"><div id="app"></div><script>window.CODE_TEXT="import numpy as np  # 导入 NumPy\nfrom sklearn.kernel_ridge import KernelRidge  # 导入核岭回归\nX = np.array([[0.0], [1.0], [2.0]])  # 准备输入点\ny = np.array([0.0, 1.0, 0.0])  # 准备非线性目标\nlength = 0.8  # 设置 RBF 核长度尺度\nlam = 0.1  # 设置岭正则强度\ndef kernel(A, B):  # 定义手写 RBF 核\n    sq = np.sum((A[:, None, :] - B[None, :, :]) ** 2, axis=2)  # 计算两组点的平方距离\n    return np.exp(-sq / (2 * length ** 2))  # 返回相似度矩阵\nK = kernel(X, X)  # 计算训练 Gram 矩阵\nalpha = np.linalg.solve(K + lam * np.eye(len(X)), y)  # 求解核岭系数\ntest = np.array([[0.5], [1.5]])  # 准备新输入\npred = kernel(test, X) @ alpha  # 用训练点核展开预测\nmodel = KernelRidge(alpha=lam, kernel='rbf', gamma=1 / (2 * length ** 2)).fit(X, y)  # 训练 sklearn 对照模型\nprint('手写系数', alpha)  # 显示系数\nprint('手写预测', pred)  # 显示手写结果\nprint('sklearn 预测', model.predict(test))  # 显示库实现结果\n";</script></body></html>
