<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>机器学习·从零到推导</title><link rel="stylesheet" href="../assets/style.css"><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><script defer src="../assets/content.js"></script><script defer src="../assets/deep.js"></script><script defer src="../assets/app.js"></script></head><body data-page="code" data-chapter="04_svm" data-prefix="../"><div id="app"></div><script>window.CODE_TEXT="import numpy as np  # 导入 NumPy\nfrom sklearn.svm import SVC  # 导入支持向量机\nX = np.array([[-2.0], [-1.0], [1.0], [2.0]])  # 准备一维可分样本\ny = np.array([-1.0, -1.0, 1.0, 1.0])  # 准备正负标签\nw = np.array([0.0])  # 初始化手写线性分类器权重\nb = 0.0  # 初始化截距\nrate = 0.02  # 设定学习率\nC = 2.0  # 设定间隔违例惩罚\nfor step in range(3000):  # 使用次梯度法训练软间隔目标\n    margin = y * (X @ w + b)  # 计算每条样本的功能间隔\n    active = margin < 1  # 找到产生铰链损失的样本\n    grad_w = w - C * np.sum(y[active, None] * X[active], axis=0)  # 计算权重次梯度\n    grad_b = -C * np.sum(y[active])  # 计算截距次梯度\n    w -= rate * grad_w  # 更新权重\n    b -= rate * grad_b  # 更新截距\nmodel = SVC(kernel='linear', C=C).fit(X, y)  # 用 sklearn 训练线性 SVM\nprint('手写决策', np.sign(X @ w + b))  # 显示手写分类结果\nprint('sklearn 支持向量', model.support_vectors_.ravel())  # 显示支持向量\nprint('sklearn 决策', model.predict(X))  # 显示库分类结果\n";</script></body></html>
